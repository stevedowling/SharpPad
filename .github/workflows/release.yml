name: release

# Build Linux packages (.deb, .rpm, .tar.gz) for x64 + arm64 and publish them
# to a GitHub Release. Triggered by pushing a version tag, or manually.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v), e.g. 1.2.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install packaging tools (fpm + rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm ruby ruby-dev build-essential
          sudo gem install --no-document fpm

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version $V"

      - name: Build packages
        run: |
          chmod +x packaging/build-linux-packages.sh
          packaging/build-linux-packages.sh "${{ matrix.rid }}" "${{ steps.ver.outputs.version }}" dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On manual runs there is no tag; fall back to a v-prefixed tag name.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', github.event.inputs.version) }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.tar.gz
            install.sh
